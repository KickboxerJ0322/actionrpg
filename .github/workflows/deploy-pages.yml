name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        if: ${{ hashFiles('game/project.godot') != '' }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Export Godot Web build
        if: ${{ hashFiles('game/project.godot') != '' }}
        run: |
          test -f game/export_presets.cfg || (echo "game/export_presets.cfg がありません。Godotで Web プリセットを保存してください。" && exit 1)
          mkdir -p dist
          godot --headless --path game --export-release "Web" ../dist/index.html

      - name: Use static web prototype
        if: ${{ hashFiles('game/project.godot') == '' && hashFiles('web/index.html') != '' }}
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - name: Validate build output
        run: |
          test -f dist/index.html || (echo "dist/index.html がありません。game/project.godot か web/index.html を用意してください。" && exit 1)

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
