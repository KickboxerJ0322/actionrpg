<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>Last Knight</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="hud-left">
          <p class="app-title">Last Knight</p>
          <div id="hearts" aria-label="health"></div>
        </div>
        <p id="score" class="score">Score: 0</p>
      </header>

      <canvas id="game" width="540" height="960" aria-label="game canvas"></canvas>

      <section class="controls" aria-label="touch controls">
        <div id="stickBase" class="stick-base"><div id="stickKnob" class="stick-knob"></div></div>
        <div class="action-row">
          <button id="magicBtn" class="action-btn magic">✨</button>
          <button id="attackBtn" class="action-btn attack">⚔️</button>
        </div>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
